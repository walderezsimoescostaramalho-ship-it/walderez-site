<main id="main" class="container">
    <div class="card">
        <h2>Exercícios</h2>
        <ul class="material-list" id="material-list" data-path="arquivos/exercicios"></ul>
    </div>
</main>

<footer class="site-footer" role="contentinfo">© 2026 – Walderez Ramalho</footer>

<script>
(async () => {
    const ul = document.getElementById('material-list');
    const path = ul.getAttribute('data-path');

    const owner = "walderezsimoescostaramalho-ship-it";
    const repo  = "walderez-site";

    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

    try {
        const resp = await fetch(url);
        if (!resp.ok) {
            ul.innerHTML = '<li>Não foi possível carregar os materiais.</li>';
            return;
        }
        const items = await resp.json();

        items.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));

        if (!items.length) {
            ul.innerHTML = '<li>Não há materiais nesta pasta.</li>';
            return;
        }

        ul.innerHTML = '';
        for (const item of items) {
            const li = document.createElement('li');

            if (item.type === 'dir') {
                const a = document.createElement('a');
                a.href = `/${repo}/${path}/${item.name}/`;
                a.textContent = item.name + '/';
                li.appendChild(a);
            } else {
                const a = document.createElement('a');
                a.href = `/${repo}/${path}/${item.name}`;
                a.textContent = item.name;

                const meta = document.createElement('span');
                meta.className = 'material-meta';
                const kb = (item.size / 1024).toFixed(1);
                meta.textContent = ` (${kb} KB)`;

                li.appendChild(a);
                li.appendChild(meta);
            }

            ul.appendChild(li);
        }
    } catch (e) {
        ul.innerHTML = '<li>Erro ao carregar materiais.</li>';
    }
})();
</script>

</body>
</html>
